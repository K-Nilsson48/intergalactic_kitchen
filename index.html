<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Intergalactic Kitchen</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-external-html@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />

    <!-- Load instructions and database helper functions -->
    <script src="intro.js?v=3"></script>

    <style>
      /* 1. Hide the default HTML checkbox */
      .ingredient-btn input[type="checkbox"] {
        display: none;
      }

      /* 2. Style the label to look like a clickable card */
      .ingredient-btn label {
        display: inline-block;
        border: 4px solid transparent;
        border-radius: 12px;
        padding: 10px;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        background-color: #f9f9f9;
      }

      /* 3. When checked, highlight the label border and background */
      .ingredient-btn input[type="checkbox"]:checked + label {
        border-color: #4CAF50;
        background-color: #e8f5e9;
        transform: scale(1.05);
      }

      /* 4. Ensure images fit nicely inside the buttons */
      .ingredient-btn img {
        width: 150px;
        height: 150px;
        object-fit: contain;
        border-radius: 8px;
        display: block;
        margin-bottom: 8px;
      }

      /* Container for the grid */
      .ingredient-grid {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 30px;
      }
    </style>
  </head>
  <body></body>
  <script>
    const jsPsych = initJsPsych({
      on_finish: () => {
        window.location = "https://wupsych.sona-systems.com/webstudy_credit.aspx?experiment_id=1091&credit_token=615d2b0234ca439abeb92d42db8d68bb&survey_code=" + sonaId;
      },
    });

    const timeline = [];

    // Capture SONA ID from URL parameter (?sona_id=XXXX)
    var sonaId = jsPsych.data.getURLVariable("sona_id") || "test_participant_" + Math.floor(Math.random() * 10000);

    // EXPERIMENT SETUP & CONDITION ASSIGNMENT ---------------------------------------------------------------------
    const ingredient_pool = ["YHex", "RSquare", "PSquare", "RTri", "PTri"];

    const shape_groups = {
      hex: ["YHex"],
      square: ["RSquare", "PSquare"],
      tri: ["RTri", "PTri"]
    };

    const structural_groups = ['unconstrained_unknown', 'constrained_unknown', 'constrained_known'];
    const assigned_group = structural_groups[Math.floor(Math.random() * structural_groups.length)];

    let use_constrained_rules = false;
    let participant_gets_hint = false;

    if (assigned_group === 'constrained_unknown') {
      use_constrained_rules = true;
    } else if (assigned_group === 'constrained_known') {
      use_constrained_rules = true;
      participant_gets_hint = true;
    }

    const block_order = shuffleArray(['count', 'correct_num', 'distance']);

    // Store subject metadata across all trials
    jsPsych.data.addProperties({
      sonaId: sonaId,
      structural_group: assigned_group,
      feedback_block_order: block_order.join('_')
    });

    // PRELOAD IMAGES ----------------------------------------------------------------------------------------------
    const preload = {
      type: jsPsychPreload,
      images: [
        'img/pot.jpg',
        'img/onion.png',
        'img/carrots.png',
        'img/beef.png',
        'img/flour.png',
        'img/Yellow Hexagon.png',
        'img/Red Square.png',
        'img/Purple Square.png',
        'img/Red Triangle.png',
        'img/Purple Triangle.png'
      ]
    };

    // CONSENT BLOCK -----------------------------------------------------------------------------------------------
    var check_consent = function(elem) {
      if (document.getElementById('consent_checkbox').checked) {
        return true;
      } else {
        alert("If you wish to participate, you must check the box next to the statement 'I agree to take part in this study.'");
        return false;
      }
    };

    var consent_block = {
      type: jsPsychExternalHtml,
      url: "consent.html?v=" + Date.now(),
      cont_btn: "start",
      check_fn: check_consent
    };

    // GENERATE TARGET RECIPES -------------------------------------------------------------------------------------
    const rounds_count = [];
    const rounds_correct_num = [];
    const rounds_distance = [];

    function generateTargetRecipe() {
      let random_recipe = [];
      if (use_constrained_rules) {
        for (const shape_category of Object.values(shape_groups)) {
          if (Math.random() > 0.20) {
            const random_item = shape_category[Math.floor(Math.random() * shape_category.length)];
            random_recipe.push(random_item);
          }
        }
        if (random_recipe.length === 0) {
          const fallback_shape = Object.values(shape_groups)[Math.floor(Math.random() * 3)];
          random_recipe.push(fallback_shape[Math.floor(Math.random() * fallback_shape.length)]);
        }
      } else {
        const num_ing = Math.floor(Math.random() * ingredient_pool.length) + 1;
        random_recipe = jsPsych.randomization.sampleWithoutReplacement(ingredient_pool, num_ing);
      }
      return random_recipe;
    }

    for (let i = 0; i < number_of_rounds_per_block; i++) {
      rounds_count.push({ target_recipe: generateTargetRecipe(), feedback_type: 'count', round_number: i + 1 });
      rounds_correct_num.push({ target_recipe: generateTargetRecipe(), feedback_type: 'correct_num', round_number: i + 1 });
      rounds_distance.push({ target_recipe: generateTargetRecipe(), feedback_type: 'distance', round_number: i + 1 });
    }

    // TRACKING VARIABLES ------------------------------------------------------------------------------------------
    let practice_attempt_count = 0;
    let attempt_count = 0;
    let total_main_attempts = 0;
    let recipe_matched = false;
    let current_secret_recipe = [];
    let last_user_selection = [];

    // PRACTICE TRIALS ---------------------------------------------------------------------------------------------
    const practice_trial = {
      type: jsPsychSurveyHtmlForm,
      html: `
        <div style="text-align: center;">
          <h1>The Soup Pot (Practice)</h1>
          <img src="img/pot.jpg" alt="An empty soup pot" style="width: 300px; height: auto; margin-bottom: 20px;">
        </div>
        <p style="color: #d32f2f; font-weight: bold; text-align: center; font-size: 1.2rem;">
          Practice Goal: Select <u>only</u> Onions and AP Flour, then click "Submit Recipe".
        </p>
        <div class="ingredient-grid">
          <div class="ingredient-btn">
            <input type="checkbox" id="onions" name="onion" value="Onions">
            <label for="onions">
              <img src="img/onion.png" alt="Onions">
              <br><strong>Onions</strong>
            </label>
          </div>
          <div class="ingredient-btn">
            <input type="checkbox" id="carrots" name="carrots" value="Carrots">
            <label for="carrots">
              <img src="img/carrots.png" alt="Carrots">
              <br><strong>Carrots</strong>
            </label>
          </div>
          <div class="ingredient-btn">
            <input type="checkbox" id="beef" name="beef" value="Beef">
            <label for="beef">
              <img src="img/beef.png" alt="Beef">
              <br><strong>Beef</strong>
            </label>
          </div>
          <div class="ingredient-btn">
            <input type="checkbox" id="ap_flour" name="ap_flour" value="AP Flour">
            <label for="ap_flour">
              <img src="img/flour.png" alt="AP Flour">
              <br><strong>AP Flour</strong>
            </label>
          </div>
        </div>
      `,
      button_label: 'Submit Recipe',
      data: { type: 'practice_trial' },
      on_finish: function(data) {
        practice_attempt_count++;
        const selected = Object.values(data.response);
        const is_correct = selected.includes('Onions') && selected.includes('AP Flour') && selected.length === 2;

        data.attempt_number = practice_attempt_count;
        data.ingredients_chosen = selected.join(',');
        data.was_correct = is_correct ? 1 : 0;
        delete data.response;
      }
    };

    const practice_feedback = {
      type: jsPsychHtmlButtonResponse,
      stimulus: function() {
        const last_trial_data = jsPsych.data.get().last(1).values()[0];
        const selected = last_trial_data.ingredients_chosen ? last_trial_data.ingredients_chosen.split(',') : [];
        const goal = ['Onions', 'AP Flour'];
        const matched_goal = selected.filter(item => goal.includes(item));
        const extra_items = selected.filter(item => !goal.includes(item));
        const missing_items = goal.filter(item => !selected.includes(item));

        if (last_trial_data.was_correct === 1) {
          return `
            <div style="text-align: center; max-width: 600px; margin: 0 auto;">
              <h1 style="color: #2e7d32;">Success!</h1>
              <p style="font-size: 1.15rem;">You selected <strong>Onions</strong> and <strong>AP Flour</strong>—exact match!</p>
              <p style="color: #555;">You now have the hang of selecting ingredients and submitting your pot.</p>
            </div>
          `;
        } else {
          const user_picks = selected.length > 0 ? selected.join(', ') : 'Nothing';
          const status_notes = [];
          status_notes.push(`Matched target items: <strong>${matched_goal.length} of 2</strong> (${matched_goal.length > 0 ? matched_goal.join(', ') : 'none'})`);
          if (missing_items.length > 0) {
            status_notes.push(`Still needed: <strong>${missing_items.join(', ')}</strong>`);
          }
          if (extra_items.length > 0) {
            status_notes.push(`Extra/wrong items selected: <strong>${extra_items.join(', ')}</strong>`);
          }

          return `
            <div style="text-align: center; max-width: 620px; margin: 0 auto;">
              <h1 style="color: #c62828;">Practice Feedback</h1>
              <p>You submitted: <strong>${user_picks}</strong></p>
              <div style="background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 14px 20px; margin: 16px auto; text-align: left;">
                <p style="margin: 6px 0;">${status_notes.join('<br>')}</p>
              </div>
              <p>Remember, for this practice round, select <strong>only Onions and AP Flour</strong>. The pot will reset automatically when you continue.</p>
            </div>
          `;
        }
      },
      choices: function() {
        const last_trial_data = jsPsych.data.get().last(1).values()[0];
        return [last_trial_data.was_correct === 1 ? 'Continue to Alien Kitchen' : 'Try Practice Again'];
      }
    };

    const practice_loop = {
      timeline: [practice_trial, practice_feedback],
      loop_function: function() {
        const form_data = jsPsych.data.get().last(2).values()[0];
        return form_data.was_correct !== 1;
      }
    };

    // MAIN EXPERIMENT TRIALS --------------------------------------------------------------------------------------
    const visual_pot_trial = {
      type: jsPsychSurveyHtmlForm,
      preamble: function() {
        const round_num = jsPsych.timelineVariable('round_number');
        return `
          <div style="text-align: center;">
            <p style="font-size: 1.1rem; color: #555; margin-bottom: 5px;">
              <strong>Recipe ${round_num} of ${number_of_rounds_per_block}</strong> &nbsp;|&nbsp; Attempt #${attempt_count + 1}
            </p>
            <h1 style="margin-top: 5px;">The Soup Pot</h1>
            <img src="img/pot.jpg" alt="An empty soup pot" style="width: 260px; height: auto; margin-bottom: 15px;">
          </div>
          <p>Click the alien ingredients you want to add to the pot, then click <strong>Taste the Soup</strong>:</p>
        `;
      },
      html: `
        <div class="ingredient-grid">
          <div class="ingredient-btn">
            <input type="checkbox" id="item_yhex" name="ing_1" value="YHex">
            <label for="item_yhex">
              <img src="img/Yellow Hexagon.png" alt="Solar Crystal">
              <strong>Solar Crystal</strong>
            </label>
          </div>
          <div class="ingredient-btn">
            <input type="checkbox" id="item_rsquare" name="ing_2" value="RSquare">
            <label for="item_rsquare">
              <img src="img/Red Square.png" alt="Magma Cube">
              <strong>Magma Cube</strong>
            </label>
          </div>
          <div class="ingredient-btn">
            <input type="checkbox" id="item_psquare" name="ing_3" value="PSquare">
            <label for="item_psquare">
              <img src="img/Purple Square.png" alt="Nebula Block">
              <strong>Nebula Block</strong>
            </label>
          </div>
          <div class="ingredient-btn">
            <input type="checkbox" id="item_rtri" name="ing_4" value="RTri">
            <label for="item_rtri">
              <img src="img/Red Triangle.png" alt="Flare Pod">
              <strong>Flare Pod</strong>
            </label>
          </div>
          <div class="ingredient-btn">
            <input type="checkbox" id="item_ptri" name="ing_5" value="PTri">
            <label for="item_ptri">
              <img src="img/Purple Triangle.png" alt="Void Shard">
              <strong>Void Shard</strong>
            </label>
          </div>
        </div>
      `,
      button_label: "Taste the Soup",
      data: { type: 'trial' },
      on_start: function() {
        current_secret_recipe = jsPsych.timelineVariable('target_recipe');
      },
      on_finish: function(data) {
        attempt_count++;
        total_main_attempts++;

        const user_selection = Object.values(data.response);
        last_user_selection = user_selection;

        const is_correct = (user_selection.length === current_secret_recipe.length) &&
                           user_selection.every(item => current_secret_recipe.includes(item));

        recipe_matched = is_correct;

        data.feedback_type = jsPsych.timelineVariable('feedback_type');
        data.round_number = jsPsych.timelineVariable('round_number');
        data.attempt_number = attempt_count;
        data.was_correct = is_correct ? 1 : 0;
        data.target_recipe = current_secret_recipe.join(',');
        data.ingredients_chosen = user_selection.join(',');
        delete data.response;
      }
    };

    const feedback_trial = {
      type: jsPsychHtmlButtonResponse,
      stimulus: function() {
        const current_feedback_type = jsPsych.timelineVariable('feedback_type');

        if (recipe_matched) {
          return getBinaryFeedback(true, attempt_count);
        }

        if (current_feedback_type === 'count') {
          return getCountFeedback(last_user_selection, current_secret_recipe);
        } else if (current_feedback_type === 'binary') {
          return getBinaryFeedback(false, attempt_count);
        } else if (current_feedback_type === 'correct_num') {
          return getCorrectNumFeedback(last_user_selection, current_secret_recipe, ingredient_pool);
        } else {
          return getDistanceFeedback(last_user_selection, current_secret_recipe, ingredient_pool);
        }
      },
      choices: function() {
        return [recipe_matched ? 'Next Recipe' : 'Next Attempt (Pot Resets)'];
      },
      on_finish: function() {
        if (recipe_matched) {
          attempt_count = 0;
        }
      }
    };

    const recipe_loop = {
      timeline: [visual_pot_trial, feedback_trial],
      loop_function: function() {
        return !recipe_matched;
      }
    };

    const procedure_count = { timeline: [recipe_loop], timeline_variables: rounds_count };
    const procedure_correct_num = { timeline: [recipe_loop], timeline_variables: rounds_correct_num };
    const procedure_distance = { timeline: [recipe_loop], timeline_variables: rounds_distance };

    // POST-EXPERIMENT SURVEYS & COMPLETION ------------------------------------------------------------------------
    const final_points = {
      type: jsPsychHtmlButtonResponse,
      stimulus: function() {
        return `<div style="max-width: 680px; margin: 0 auto; text-align: center; line-height: 1.6;">
                  <h1>All Recipes Complete!</h1>
                  <p>Congrats! You completed all <strong>${total_recipes}</strong> ${recipe_word} in the Intergalactic Kitchen.</p>
                  <p>You solved all of the secret recipes in <strong>${total_main_attempts}</strong> total attempts.</p>
                  <p>We have a few quick questions for you before the experiment is finished.</p>
                </div>`;
      },
      choices: ["Continue to Questions"],
      data: {
        type: "final_points",
        total_attempts: function() {
          return total_main_attempts;
        }
      }
    };

    var strategy_block = {
      timeline: [
        {
          type: jsPsychSurveyText,
          preamble: ["Please answer the following question:"],
          questions: [{ prompt: "Did you use any specific strategies to figure out the secret recipes under the different feedback rules? If so, what were they?", required: true }],
          data: { type: "strategy" }
        }
      ],
      loop_function: function() {
        var strategy = jsPsych.data.getLastTrialData().select('response').values[0].Q0;
        if (strategy.trim() === '') {
          alert("Please make sure you answer the question.");
          return true;
        }
        return false;
      }
    };

    var demographics_block = {
      timeline: [
        {
          type: jsPsychSurveyText,
          preamble: ["Please provide us with some information about yourself:"],
          questions: [
            { prompt: "How old are you?", required: true },
            { prompt: "What is your gender?", required: true }
          ],
          data: { type: "demographics" }
        }
      ],
      loop_function: function() {
        var age_ans = jsPsych.data.getLastTrialData().select('response').values[0].Q0;
        var gender = jsPsych.data.getLastTrialData().select('response').values[0].Q1;

        if ((age_ans.trim() === '') || (gender.trim() === '')) {
          alert("Please make sure you answer all questions.");
          return true;
        }
        if (isNaN(age_ans)) {
          alert("Please enter your age as a number (make sure to remove any spaces).");
          return true;
        }
        return false;
      }
    };

    var debriefing_block = {
      type: jsPsychExternalHtml,
      url: "debrief.html?v=" + Date.now(),
      cont_btn: "start"
    };

    // SAVE DATA BLOCKS --------------------------------------------------------------------------------------------
    var save_practice_block = {
      type: jsPsychCallFunction,
      func: function() {
        var data = jsPsych.data.get().filter({ type: 'practice_trial' }).json();
        save_data(encodeURIComponent(data), "IK_practice");
      }
    };

    var save_data_block = {
      type: jsPsychCallFunction,
      func: function() {
        var data = jsPsych.data.get().filter({ type: 'trial' }).json();
        save_data(encodeURIComponent(data), "IK_responses");
      }
    };

    var save_sub_info_block = {
      type: jsPsychCallFunction,
      func: function() {
        var demographics_data = jsPsych.data.get().filter({ type: "demographics" }).trials[0].response;
        var feedback_data = jsPsych.data.get().filter({ type: 'strategy' }).trials[0].response.Q0;
        var attempts_score = jsPsych.data.get().filter({ type: 'final_points' }).trials[0].total_attempts;

        var subinfo = {
          sonaId: sonaId,
          structural_group: assigned_group,
          feedback_block_order: block_order.join('_'),
          age: parseInt(demographics_data.Q0),
          gender: demographics_data.Q1,
          time_elapsed: jsPsych.getTotalTime(),
          total_attempts: attempts_score,
          strategy: feedback_data
        };
        var data = encodeURIComponent(JSON.stringify([subinfo]));
        save_data(data, 'IK_subinfo');
      }
    };

    // BUILD & RUN TIMELINE ----------------------------------------------------------------------------------------
    timeline.push(preload);
    timeline.push(consent_block);
    timeline.push(ui_instructions);
    timeline.push(practice_loop);
    timeline.push(save_practice_block);
    timeline.push(alien_kitchen_intro);

    if (participant_gets_hint) {
      timeline.push(instructions_known);
    }

    for (const block of block_order) {
      if (block === 'count') {
        timeline.push(instructions_intersection);
        timeline.push(procedure_count);
      } else if (block === 'correct_num') {
        timeline.push(instructions_correct_num);
        timeline.push(procedure_correct_num);
      } else if (block === 'distance') {
        timeline.push(instructions_action_model);
        timeline.push(procedure_distance);
      }
    }

    timeline.push(save_data_block);
    timeline.push(final_points);
    timeline.push(strategy_block);
    timeline.push(demographics_block);
    timeline.push(save_sub_info_block);
    timeline.push(debriefing_block);

    jsPsych.run(timeline);
  </script>
</html>
